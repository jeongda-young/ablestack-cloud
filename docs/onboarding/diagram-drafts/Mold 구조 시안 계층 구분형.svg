<rect x="108" y="558" width="5" height="5" rx="2" fill="#6554B7" stroke="none" stroke-width="2"/>
<text x="174" y="531" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="40" font-weight="700" fill="#172B45">CCVM</text>
<text x="104" y="606" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="29" font-weight="700" fill="#6554B7">Mold 관리 서버</text>
<polyline points="424,520 424,676" fill="none" stroke="#D4DFE9" stroke-width="2"/>
