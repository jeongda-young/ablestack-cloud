<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1650" viewBox="0 0 1800 1650">
<rect width="100%" height="100%" fill="white"/>
<text x="72" y="56" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="54" font-weight="700" fill="#172B45">Mold 개발 위치와 실행 구조</text>
<text x="72" y="134" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="32" font-weight="400" fill="#506378">계층 구분형  ·  개발하는 곳과 관리하는 곳, 실제로 실행하는 곳을 구분</text>
<rect x="72" y="230" width="1656" height="216" rx="20" fill="#F0F7FF" stroke="none" stroke-width="2"/>
<rect x="100" y="266" width="54" height="35" rx="5" fill="white" stroke="#146CBA" stroke-width="3"/>
<polyline points="127,302 127,314" fill="none" stroke="#146CBA" stroke-width="3"/>
<polyline points="111,314 143,314" fill="none" stroke="#146CBA" stroke-width="3"/>
<text x="174" y="271" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="40" font-weight="700" fill="#172B45">개발 PC</text>
<text x="104" y="346" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="29" font-weight="700" fill="#146CBA">macOS · 로컬 UI</text>
<polyline points="424,260 424,416" fill="none" stroke="#D4DFE9" stroke-width="2"/>
