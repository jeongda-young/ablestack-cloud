<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
<rect width="100%" height="100%" fill="white"/>
<text x="72" y="48" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="52" font-weight="700" fill="#172B45">오류 유형별 확인 순서</text>
<text x="72" y="127" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="36" font-weight="400" fill="#506378">증상에 맞는 경로 하나를 선택합니다. 네 경로를 순서대로 모두 실행하는 것은 아닙니다.</text>
<rect x="72" y="225" width="804" height="423" rx="20" fill="#F0F7FF" stroke="none" stroke-width="2"/>
<text x="100" y="253" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="44" font-weight="700" fill="#172B45">의존성 설치 오류</text>
<text x="102" y="337" dominant-baseline="text-before-edge" font-family="NanumSquare" font-size="38" font-weight="400" fill="#506378">1  Node·npm·CPU 확인</text>
